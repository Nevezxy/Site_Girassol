<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notícias - OSC/ONG</title>
    <link rel="stylesheet" href="css/noticias.css">
</head>
<body>
    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-image" id="heroImage"></div>
        <div class="hero-content">
            <h1 class="hero-title">Notícias e Atualizações</h1>
            <p class="hero-subtitle">Fique informado sobre nossas ações e impacto na comunidade</p>
        </div>
    </section>

    <!-- Main Content -->
    <main class="container">
        <!-- Filtros e Busca -->
        <section class="filters-section">
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="Buscar notícias..."
                    aria-label="Buscar notícias"
                >
                <button class="search-btn" aria-label="Realizar busca">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </button>
            </div>
        </section>

        <!-- Loading State -->
        <div id="loading" class="loading" role="status" aria-live="polite">
            <div class="spinner"></div>
            <p>Carregando notícias...</p>
        </div>

        <!-- Error State -->
        <div id="error" class="error-message" role="alert" aria-live="assertive"></div>

        <!-- News Grid -->
        <section id="newsGrid" class="news-grid">
            <!-- Cards serão inseridos aqui pelo JavaScript -->
        </section>

        <!-- Empty State -->
        <div id="empty" class="empty-state" style="display: none;">
            <p>Nenhuma notícia encontrada.</p>
        </div>
    </main>

    <!-- Footer spacing -->
    <div style="height: 4rem;"></div>

    <script src="js/noticias.js"></script>
</body>
</html>
